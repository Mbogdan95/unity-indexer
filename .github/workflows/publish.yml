name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install build dependencies
        run: sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm version ${{ inputs.release_type }} --no-git-tag-version

      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          FEATURES=""
          FIXES=""
          PERF=""
          DOCS=""
          MAINTENANCE=""

          while IFS= read -r line; do
            msg="${line#*: }"
            case "$line" in
              feat:*|feat\(*) FEATURES="${FEATURES}- ${msg}\n" ;;
              fix:*|fix\(*) FIXES="${FIXES}- ${msg}\n" ;;
              perf:*|perf\(*) PERF="${PERF}- ${msg}\n" ;;
              docs:*|docs\(*) DOCS="${DOCS}- ${msg}\n" ;;
              *) MAINTENANCE="${MAINTENANCE}- ${msg}\n" ;;
            esac
          done <<< "$COMMITS"

          CHANGELOG="## What's Changed\n\n"
          [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### Features\n\n${FEATURES}\n"
          [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}### Bug Fixes\n\n${FIXES}\n"
          [ -n "$PERF" ] && CHANGELOG="${CHANGELOG}### Performance\n\n${PERF}\n"
          [ -n "$DOCS" ] && CHANGELOG="${CHANGELOG}### Documentation\n\n${DOCS}\n"
          [ -n "$MAINTENANCE" ] && CHANGELOG="${CHANGELOG}### Maintenance\n\n${MAINTENANCE}\n"

          {
            echo "body<<CHANGELOG_EOF"
            echo -e "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"

      - name: Create tag
        run: git tag "v${{ steps.version.outputs.version }}"

      - name: Push commit and tag
        run: git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.body }}"
